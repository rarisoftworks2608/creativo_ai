# Full stack in containers (Epic 26: Docker Compose) - PostgreSQL, Redis, Django API,
# Celery worker, Celery beat, and Nginx serving the React app + proxying the API.
#
#   cp backend/.env.example backend/.env      # fill in SECRET_KEY, API keys, ...
#   docker compose up -d --build
#   open http://localhost (or WEB_PORT)
#
# For HTTPS in production add the SSL override:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# See docs/deployment.md.

x-backend: &backend
  build: ./backend
  image: creativo-backend
  env_file: ./backend/.env
  environment: &backend-env
    DATABASE_URL: postgres://${POSTGRES_USER:-creativo}:${POSTGRES_PASSWORD:-creativo}@db:5432/${POSTGRES_DB:-creativo}
    REDIS_URL: redis://redis:6379/0
    CELERY_BROKER_URL: redis://redis:6379/0
    CELERY_RESULT_BACKEND: redis://redis:6379/0
    DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings.production}
    ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
    CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost}
    SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-False}
    LOG_TO_FILE: "True"
  volumes:
    - media:/app/media
    - logs:/app/logs
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-creativo}
      POSTGRES_USER: ${POSTGRES_USER:-creativo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-creativo}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-creativo} -d ${POSTGRES_DB:-creativo}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend:
    <<: *backend
    environment:
      <<: *backend-env
      RUN_MIGRATIONS: "1"
    volumes:
      - media:/app/media
      - logs:/app/logs
      - static:/app/staticfiles
    command: >
      sh -c "python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers ${GUNICORN_WORKERS:-3}
             --timeout 120 --access-logfile -"

  worker:
    <<: *backend
    command: celery -A config worker -l info --concurrency ${CELERY_CONCURRENCY:-2}
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$HOSTNAME --timeout 5 || exit 1"]
      interval: 60s
      timeout: 15s
      retries: 3

  beat:
    <<: *backend
    command: celery -A config beat -l info -s /app/celerybeat/schedule
    volumes:
      - media:/app/media
      - logs:/app/logs
      - celerybeat:/app/celerybeat
    healthcheck:
      disable: true

  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api/v1
    image: creativo-web
    ports:
      - "${WEB_PORT:-80}:80"
    volumes:
      - media:/srv/media:ro
      - static:/srv/static:ro
    depends_on:
      - backend
    restart: unless-stopped

  # Optional Celery dashboard: docker compose --profile monitoring up -d flower
  flower:
    image: mher/flower:2.0
    profiles: ["monitoring"]
    command: celery --broker=redis://redis:6379/0 flower --port=5555 --basic_auth=${FLOWER_USER:-admin}:${FLOWER_PASSWORD:-change-me}
    ports:
      - "${FLOWER_PORT:-5555}:5555"
    depends_on:
      - redis

volumes:
  postgres_data:
  redis_data:
  media:
  static:
  logs:
  celerybeat:
